apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartmedicare-ingress
  namespace: smartmedicare
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/health-check-path: /
    alb.ingress.kubernetes.io/health-check-interval-seconds: "30"
    alb.ingress.kubernetes.io/health-check-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    
    # SSL/TLS (if using HTTPS)
    # alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-2016-08
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:<ACCOUNT_ID>:certificate/<CERT_ID>
    
    # Rewrite rules for API routing
    alb.ingress.kubernetes.io/actions.replace-backend: |
      {
        "type": "rewrite",
        "rewriteConfig": {
          "inputKind": "HTTPRequest",
          "outputKind": "HTTPResponse"
        }
      }
spec:
  ingressClassName: alb
  rules:
  # Option 1: With custom domain (replace with your domain)
  # - host: smartmedicare.yourdomain.com
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: client
  #           port:
  #             number: 80
  #     - path: /gateway
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: gateway
  #           port:
  #             number: 5000

  # Option 2: Without custom domain (using ALB DNS)
  - http:
      paths:
      # Frontend - serve React app
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client
            port:
              number: 80
      
      # API Gateway - route all /gateway/* requests to gateway
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 5000