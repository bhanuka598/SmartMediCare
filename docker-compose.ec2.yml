services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: client
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - smartcare-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.prod
    container_name: gateway
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - appointment-service
      - payment-service
      - notification-service
      - telemedicine-service
    environment:
      PORT: 5000
      CORS_ORIGINS: ${CORS_ORIGINS}
      APPOINTMENT_SERVICE_URL: http://appointment-service:5001
      AUTH_SERVICE_URL: http://auth-service:5002
      DOCTOR_SERVICE_URL: http://doctor-service:5003
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
      PATIENT_SERVICE_URL: http://patient-service:5005
      PAYMENT_SERVICE_URL: http://payment-service:5006
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:5007
    networks:
      - smartcare-net

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      PORT: 5002
      MONGO_URI: ${MONGO_AUTH_URI}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - smartcare-net

  patient-service:
    build: ./services/patient-service
    container_name: patient-service
    environment:
      PORT: 5005
      MONGO_URI: ${MONGO_PATIENT_URI}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:5007
      APPOINTMENT_SERVICE_URL: http://appointment-service:5001
    networks:
      - smartcare-net

  doctor-service:
    build: ./services/doctor-service
    container_name: doctor-service
    environment:
      PORT: 5003
      MONGO_URI: ${MONGO_DOCTOR_URI}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:5002
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    networks:
      - smartcare-net

  appointment-service:
    build: ./services/appointment-service
    container_name: appointment-service
    environment:
      PORT: 5001
      MONGO_URI: ${MONGO_APPOINTMENT_URI}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:5002
      PATIENT_SERVICE_URL: http://patient-service:5005
      DOCTOR_SERVICE_URL: http://doctor-service:5003
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
      TELEMEDICINE_SERVICE_URL: http://telemedicine-service:5007
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    networks:
      - smartcare-net

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    environment:
      PORT: 5006
      MONGO_URI: ${MONGO_PAYMENT_URI}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      APPOINTMENT_SERVICE_URL: http://appointment-service:5001
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    networks:
      - smartcare-net

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      PORT: 5004
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      EMAIL_FROM: ${EMAIL_FROM}
    networks:
      - smartcare-net

  telemedicine-service:
    build: ./services/telemedicine-service
    container_name: telemedicine-service
    environment:
      PORT: 5007
      MONGO_URI: ${MONGO_TELEMEDICINE_URI}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - smartcare-net

networks:
  smartcare-net:
    driver: bridge
