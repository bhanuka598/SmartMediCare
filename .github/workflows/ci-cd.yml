name: CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Validate Apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - client
          - gateway
          - services/auth-service
          - services/appointment-service
          - services/doctor-service
          - services/notification-service
          - services/patient-service
          - services/payment-service
          - services/telemedicine-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Lint client
        if: matrix.app == 'client'
        run: npm run lint
        working-directory: client

      - name: Build client
        if: matrix.app == 'client'
        run: npm run build
        working-directory: client

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            context: ./client
            file: ./client/Dockerfile
          - name: gateway
            context: ./gateway
            file: ./gateway/Dockerfile
          - name: auth-service
            context: ./services/auth-service
            file: ./services/auth-service/Dockerfile
          - name: appointment-service
            context: ./services/appointment-service
            file: ./services/appointment-service/Dockerfile
          - name: doctor-service
            context: ./services/doctor-service
            file: ./services/doctor-service/Dockerfile
          - name: notification-service
            context: ./services/notification-service
            file: ./services/notification-service/Dockerfile
          - name: patient-service
            context: ./services/patient-service
            file: ./services/patient-service/Dockerfile
          - name: payment-service
            context: ./services/payment-service
            file: ./services/payment-service/Dockerfile
          - name: telemedicine-service
            context: ./services/telemedicine-service
            file: ./services/telemedicine-service/Dockerfile

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/smartmedicare-${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

