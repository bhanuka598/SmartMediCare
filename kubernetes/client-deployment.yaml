apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: smartmedicare
  labels:
    app: client
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
        tier: frontend
    spec:
      containers:
      - name: client
        image: smartmedicare/client:latest
        imagePullPolicy: Never  # Use local images for development
        ports:
        - containerPort: 5173
          name: http
        env:
        - name: VITE_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: smartmedicare-config
              key: VITE_API_BASE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: smartmedicare
  labels:
    app: client
spec:
  selector:
    app: client
  ports:
  - port: 5173
    targetPort: 5173
    protocol: TCP
    name: http
  type: ClusterIP
