apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: smartmedicare
  labels:
    app: patient-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
        tier: backend
    spec:
      containers:
      - name: patient-service
        image: smartmedicare/patient-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5005
          name: http
        env:
        - name: PORT
          value: "5005"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: smartmedicare-secrets
              key: MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: smartmedicare-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: smartmedicare
  labels:
    app: patient-service
spec:
  selector:
    app: patient-service
  ports:
  - port: 5005
    targetPort: 5005
    protocol: TCP
    name: http
  type: ClusterIP
